[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "文肇乐" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.8",
    "langchain-deepseek>=1.1.1",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "openai>=3.35.1",
    "pymilvus>=3.0.2",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
